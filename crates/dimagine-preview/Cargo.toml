[package]
name = "dimagine-preview"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[workspace]

[dependencies]
image = { version = "0.25.8", default-features = false, features = ["bmp", "gif", "jpeg", "png", "tiff", "webp"] }
kamadak-exif = "0.6.1"
sha2 = "0.10.9"
tempfile = "3.23.0"
thiserror = "2.0.17"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
lcms2 = { version = "6.1.1", features = ["static"] }
png = "0.18.1"
tiff = { version = "0.11.2", default-features = false }
zune-core = "0.5.3"
zune-jpeg = "0.5.15"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
