[package]
name = "dimagine-serve"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false


[dependencies]
axum = { version = "0.7", features = ["form", "json"] }
ammonia = "4"
httpdate = "1"
mime_guess = "2"
pulldown-cmark = "0.10"
sha2 = "0.10"
saphyr = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subtle = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "fs", "io-util", "sync", "time"] }
tokio-util = { version = "0.7", features = ["io"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
tempfile = "3"
