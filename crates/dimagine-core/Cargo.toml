[package]
name = "dimagine-core"
description = "Read-only core for dimagine: walk a library folder, parse notes and resolve links."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
percent-encoding = "2.3"
saphyr = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-normalization = "0.1"