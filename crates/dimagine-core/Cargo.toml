[package]
name = "dimagine-core"
description = "Read-only core for dimagine: walk a library folder, parse notes and resolve links."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
chrono = { version = "0.4", features = ["clock"] }
dimagine-index = { path = "../dimagine-index" }
image = { version = "0.25.8", default-features = false, features = ["bmp", "gif", "jpeg", "png", "tiff", "webp"] }
kamadak-exif = "0.6.1"
percent-encoding = "2.3"
saphyr = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"
unicode-normalization = "0.1"
libc = "0.2"

[dev-dependencies]
tempfile = "3"
