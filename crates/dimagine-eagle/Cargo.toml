[package]
name = "dimagine-eagle"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
chrono = { version = "0.4", features = ["clock"] }
dimagine-core = { path = "../dimagine-core" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["unbounded_depth"] }
serde_stacker = "0.1"
ulid = "1"
unicode-normalization = "0.1"

[dev-dependencies]
tempfile = "3"
saphyr = "0.1"

