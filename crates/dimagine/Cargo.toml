[package]
name = "dimagine"
description = "dimagine: tools for a folder-of-images image library (scan, check, import, previews, serve)."
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Built-in plugins are Cargo features, enabled by default (ADR-013). A build
# with --no-default-features still ships the always-on `scan` and `check`.
default = ["import-eagle", "previews", "serve"]
import-eagle = ["dep:dimagine-eagle"]
previews = ["dep:dimagine-preview"]
serve = ["dep:dimagine-serve", "dep:tokio", "dep:axum"]

[[bin]]
name = "dimagine"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
rpassword = "7"
dimagine-core = { path = "../dimagine-core" }
dimagine-index = { path = "../dimagine-index" }
dimagine-eagle = { path = "../dimagine-eagle", optional = true }
dimagine-preview = { path = "../dimagine-preview", optional = true }
dimagine-serve = { path = "../dimagine-serve", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "signal"], optional = true }
# Same major version as `dimagine-serve` uses, so the `Router` it builds and the
# serve machinery here are the same types; the CLI needs the serve builder
# itself to run the graceful shutdown on stop signals.
axum = { version = "0.7", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
chrono = { version = "0.4", features = ["clock"] }
dimagine-index = { path = "../dimagine-index" }
# The previews tests build their library in the system temp dir and remove it
# themselves, so they take it out of tempfile's cleanup with `TempDir::keep` —
# first in 3.20.0, where that was renamed from `into_path`. The floor names what
# the code needs and no more.
tempfile = "3.20.0"
